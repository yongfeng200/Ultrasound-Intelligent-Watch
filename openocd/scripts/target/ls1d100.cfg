reset_config srst_only

transport select jtag

set _CHIPNAME loongarch


#irlen ir寄存器长度

jtag newtap $_CHIPNAME cpu -irlen 4 -ircapture 0x01 -irmask 0x1f -expected-id 0x5a5a5a5a -ignore-bypass
#jtag newtap $_CHIPNAME cpu -irlen 4 -ircapture 0x01 -expected-id 0x5a5a5a5a -ignore-bypass

set _TARGETNAME $_CHIPNAME.cpu
set _ENDIAN little
target create $_TARGETNAME loongarch -endian $_ENDIAN -chain-position $_TARGETNAME

#0x10000000  4K
set _WORKAREASIZE 0x1000
$_TARGETNAME configure -work-area-phys 0x10000000 -work-area-size $_WORKAREASIZE -work-area-backup 0

#0x1c000000 128k
#set _FLASHNAME $_CHIPNAME.flash
set _FLASHNAME la132.flash
set _FLASH_SIZE 0x20000
#存储空间地址   寄存器空间地址
#flash bank $_FLASHNAME la132 0x1c000000 $_FLASH_SIZE 0 0 $_TARGETNAME
flash bank $_FLASHNAME la132 0x1f000000 $_FLASH_SIZE 0 0 $_TARGETNAME 0x1fe60000